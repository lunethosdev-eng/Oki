name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Regenerate Android (Flutter embedding)
        run: |
          set -e
          rm -rf android
          flutter create . --project-name pokke --org com.pokke --platforms=android
          if [ -f test/widget_test.dart ]; then
            cat > test/widget_test.dart << 'TESTEOF'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:pokke/main.dart';

          void main() {
            testWidgets('PokkeApp exists', (tester) async {
              expect(PokkeApp, isNotNull);
            });
          }
          TESTEOF
          fi

      - name: Force compileSdk 36 + patch manifest
        run: |
          set -e
          # Force compileSdk / targetSdk high enough for modern plugins
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            # Groovy DSL
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE" || true
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' "$APP_GRADLE" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$APP_GRADLE" || true
            sed -i 's/targetSdk flutter.targetSdkVersion/targetSdk 35/' "$APP_GRADLE" || true
          fi
          # Kotlin DSL variant
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$APP_KTS" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 35/' "$APP_KTS" || true
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(0)
          t = p.read_text()
          perms = """
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
          """
          if "FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in t:
              t = re.sub(r"(<manifest[^>]*>)", r"\1\n" + perms, t, count=1)
          if "LEANBACK_LAUNCHER" not in t and "android.intent.category.LAUNCHER" in t:
              t = t.replace(
                  """<category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>""",
                  """<category android:name="android.intent.category.LAUNCHER"/>
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
              </intent-filter>""",
              )
          if "usesCleartextTraffic" not in t:
              t = t.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(t)
          print("manifest + compileSdk patched")
          PY
          echo "--- app build.gradle ---"
          cat android/app/build.gradle 2>/dev/null || cat android/app/build.gradle.kts

      - name: Pub get
        run: flutter pub get

      - name: Generate launcher icons (Pokke logo)
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pokke-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
