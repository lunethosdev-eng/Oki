name: pokke
description: Pokke — music, friends, liquid glass
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  audioplayers: ^5.2.1
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  http: ^1.2.1
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  palette_generator: ^0.3.3+3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  share_plus: ^7.2.2
  connectivity_plus: ^6.0.3
  url_launcher: ^6.2.5
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/pokke_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/pokke_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/sounds/
    - assets/icons/
