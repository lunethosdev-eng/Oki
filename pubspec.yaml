name: pokke
description: Pokke — music, friends, liquid glass
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  http: ^1.2.2
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  palette_generator: ^0.3.3+5
  video_player: ^2.9.2
  speech_to_text: ^7.0.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  share_plus: ^10.1.2
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  latlong2: ^0.9.1
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/pokke_logo_solid.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/pokke_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/sounds/
    - assets/icons/
